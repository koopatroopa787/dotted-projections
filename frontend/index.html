<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dotted Projections</title>
<style>
  :root {
    --bg: #ffffff;
    --dot: #111418;
    --accent: #e0210f;
    --text: #9aa3ad;
    --text-bright: #1a1f25;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #map { display: block; width: 100vw; height: 100vh; }

  #console {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(7vh, 44px);
    width: min(640px, calc(100vw - 48px));
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  #console::before {
    content: "";
    position: absolute;
    left: -8%; right: -8%; top: -240%; bottom: -180%;
    background: radial-gradient(ellipse at center,
      rgba(255,255,255,.97) 0%, rgba(255,255,255,.9) 42%, rgba(255,255,255,0) 74%);
    pointer-events: none;
    z-index: -1;
  }
  #caret { color: var(--accent); font-size: 15px; line-height: 1; opacity: .9; }
  #cmd {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text-bright); font: inherit; font-size: 15px; padding: 2px 0;
  }
  #hint {
    position: absolute; left: 27px; bottom: 2px;
    font-size: 15px; color: #b9c0c8; pointer-events: none; white-space: nowrap;
    transition: opacity .45s ease, transform .45s ease;
  }
  #hint.out { opacity: 0; transform: translateY(-4px); }
  #rule {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(max(7vh, 44px) - 10px);
    width: min(640px, calc(100vw - 48px)); height: 1px;
    background: linear-gradient(to right,
      rgba(0,0,0,0), rgba(0,0,0,.16) 12%, rgba(0,0,0,.16) 88%, rgba(0,0,0,0));
  }

  #status {
    position: fixed; top: max(22px, env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--text); pointer-events: none; white-space: nowrap;
  }

  /* Solid pill so the label reads over a dense dot field instead of
     disappearing into it. */
  #label {
    position: fixed;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: #fff; background: var(--accent);
    padding: 4px 9px; border-radius: 2px;
    pointer-events: none; opacity: 0;
    transition: opacity .4s ease;
    white-space: nowrap;
    box-shadow: 0 1px 10px rgba(0,0,0,.22);
  }
  #label.on { opacity: 1; }
  .spin { display: inline-block; animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none } }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="status"></div>
<div id="label"></div>
<div id="rule"></div>
<form id="console" autocomplete="off">
  <span id="caret">›</span>
  <input id="cmd" name="cmd" aria-label="type anything">
  <span id="hint"></span>
</form>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d", { alpha: false });
  const statusEl = document.getElementById("status");
  const labelEl = document.getElementById("label");
  const hintEl = document.getElementById("hint");
  const form = document.getElementById("console");
  const input = document.getElementById("cmd");

  const setStatus = (t, busy) => {
    statusEl.innerHTML = busy ? `<span class="spin">•</span> ${t}` : (t || "");
  };

  // ── State ──────────────────────────────────────────────────────────────────
  let grid = null;
  let dots = [];
  let landCells = null;
  let reversed = false;
  let view = { x: 0, y: 0, w: 1, h: 1, cell: 1 };
  let marker = null;
  let dpr = 1, cssW = 0, cssH = 0;

  // Every dot interpolates from where it currently IS to where it is going.
  // Animating from the map each time is what made the world flash back between
  // one greeting and the next.
  let morphStart = -1;
  // ?slow stretches every transition, which is the only practical way to look
  // at one frame by frame.
  const MORPH_SECONDS =
    new URLSearchParams(location.search).has("slow") ? 7 : 1.05;

  let overlay = null;   // { kind, points:[{lon,lat,value,label,on}], summary }
  let introTimer = null, chatTimer = null;
  let chatLines = [];

  // ── Projection ─────────────────────────────────────────────────────────────
  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.max(1, Math.round(rect.height));
    cssW = w; cssH = h;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!grid) return;
    const spanLat = grid.latMax - grid.latMin;
    const aspect = 360 / spanLat;
    const pad = 0.94;
    let vw = w * pad, vh = vw / aspect;
    if (vh > h * pad) { vh = h * pad; vw = vh * aspect; }
    view = { x: (w - vw) / 2, y: (h - vh) / 2, w: vw, h: vh,
             cell: vw / (360 / grid.step) };
  }

  const sx = (gx) => view.x + gx * view.w;
  const sy = (gy) => view.y + gy * view.h;

  // ── Data ───────────────────────────────────────────────────────────────────
  function makeDot(col, row, countryId) {
    const lon = grid.lonMin + col * grid.step;
    const lat = grid.latMax - row * grid.step;
    const hx = (lon + 180) / 360;
    const hy = (grid.latMax - lat) / (grid.latMax - grid.latMin);
    return {
      lon, lat, country: countryId, hx, hy,
      fx: hx, fy: hy, tx: hx, ty: hy,     // from / to, normalised
      cx: hx, cy: hy,                     // where it is right now
      active: true,
      phase: (Math.sin(lon * 12.9898 + lat * 78.233) * 43758.5453) % (Math.PI * 2),
    };
  }

  function buildDots() {
    const out = [];
    if (!reversed) {
      for (let i = 0; i < grid.count; i++) {
        out.push(makeDot(grid.cols[i], grid.rows[i], grid.countryIds[i]));
      }
    } else {
      // The sea becomes the ink and the land becomes the hole.
      for (let r = 0; r < grid.nRows; r++) {
        for (let c = 0; c < grid.nCols; c++) {
          if (!landCells.has(c + "," + r)) out.push(makeDot(c, r, -1));
        }
      }
    }
    dots = out;
    morphStart = -1;
  }

  async function loadGrid() {
    const res = await fetch("dots.json");
    if (!res.ok) throw new Error("dots.json " + res.status);
    grid = await res.json();
    landCells = new Set();
    for (let i = 0; i < grid.count; i++) landCells.add(grid.cols[i] + "," + grid.rows[i]);
    buildDots();
    layout();
  }

  function nearestDot(lon, lat) {
    let best = -1, bestD = Infinity;
    for (let i = 0; i < dots.length; i++) {
      let dLon = Math.abs(dots[i].lon - lon);
      if (dLon > 180) dLon = 360 - dLon;
      const dx = dLon * Math.cos((lat * Math.PI) / 180);
      const dy = dots[i].lat - lat;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  const DRIFT_RATIO = 0.05;
  const DOT_RATIO = 0.30;

  function draw(now) {
    const t = now / 1000;
    ctx.fillStyle = getVar("--bg");
    ctx.fillRect(0, 0, cssW, cssH);

    if (grid) {
      const r = Math.max(0.6, view.cell * DOT_RATIO);
      const drift = view.cell * DRIFT_RATIO;

      let p = 1;
      if (morphStart >= 0) {
        const raw = Math.min(1, (t - morphStart) / MORPH_SECONDS);
        p = raw < 0.5 ? 4 * raw ** 3 : 1 - (-2 * raw + 2) ** 3 / 2;
      }

      // Three groups: dots that were already lit, dots joining the shape (they
      // have to fade in or they pop into existence mid-flight), and dots
      // leaving it.
      updateSun(now);
      const solid = new Path2D();
      const night = new Path2D();
      const arriving = new Path2D();
      const leaving = new Path2D();
      for (let i = 0; i < dots.length; i++) {
        const d = dots[i];
        d.cx = d.fx + (d.tx - d.fx) * p;
        d.cy = d.fy + (d.ty - d.fy) * p;
        const inShape = d.tx !== d.hx || d.ty !== d.hy;

        // Dormant: faded out already and not wanted by this shape either. Drawn
        // at all, it flashes back to full opacity at the start of every morph,
        // because the leaving fade is a function of p and p restarts at zero.
        // These are the dots still sitting on their continents, which is
        // exactly the ghost map that kept coming back.
        if (!d.active && d.wasActive === false) continue;

        const x = sx(d.cx) + Math.sin(t * 0.55 + d.phase) * drift;
        const y = sy(d.cy) + Math.cos(t * 0.41 + d.phase * 1.7) * drift;
        // Only shade while the map is the map; a word made of dots should
        // not be half in shadow.
        const into = !d.active ? leaving
          : (d.wasActive === false ? arriving
          : (p >= 1 && !inShape && !dotIsLit(d) ? night : solid));
        into.moveTo(x + r, y);
        into.arc(x, y, r, 0, Math.PI * 2);
      }
      ctx.fillStyle = getVar("--dot");
      ctx.fill(solid);
      ctx.globalAlpha = 0.30;          // the night side of the planet
      ctx.fill(night);
      ctx.globalAlpha = 1;

      // Arrivals stay invisible until they are most of the way across. They set
      // off from wherever they faded out — often still in map formation — so
      // showing them early paints a ghost of the world above the word.
      const arrivingAlpha = Math.max(0, Math.min(1, (p - 0.55) / 0.35));
      if (arrivingAlpha > 0.01) {
        ctx.globalAlpha = arrivingAlpha;
        ctx.fill(arriving);
      }
      const leavingAlpha = Math.max(0, 1 - p * 2.6);
      if (leavingAlpha > 0.01) {
        ctx.globalAlpha = leavingAlpha;
        ctx.fill(leaving);
      }
      ctx.globalAlpha = 1;

      if (overlay) drawOverlay(t, r);
      if (marker) drawMarker(t, r);
    }
    requestAnimationFrame(draw);
  }

  function drawMarker(t, r) {
    const d = dots[marker.index];
    if (!d) return;
    const x = sx(d.cx), y = sy(d.cy);
    const accent = getVar("--accent");

    // Crosshair: finding one lit dot in four thousand needs a pointer, and
    // guides do that without inflating the dot into a lie about area.
    ctx.strokeStyle = accent;
    ctx.globalAlpha = 0.28;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, view.y - 10); ctx.lineTo(x, y - r * 3);
    ctx.moveTo(x, y + r * 3); ctx.lineTo(x, view.y + view.h + 10);
    ctx.moveTo(view.x - 10, y); ctx.lineTo(x - r * 3, y);
    ctx.moveTo(x + r * 3, y); ctx.lineTo(view.x + view.w + 10, y);
    ctx.stroke();

    // A breathing ring, drawn as an outline so the dot itself stays one dot.
    const cycle = ((t - marker.born) % 1.9) / 1.9;
    ctx.globalAlpha = 0.55 * (1 - cycle);
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(x, y, r * 2 + cycle * view.cell * 7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = accent;
    ctx.fill();

    if (marker.label) {
      labelEl.textContent = marker.label;
      const w = labelEl.offsetWidth || 80;
      // Flip to the left near the right edge so the pill never runs off-screen.
      const left = (x + 18 + w > cssW) ? x - 18 - w : x + 18;
      labelEl.style.left = left + "px";
      labelEl.style.top = (y - 10) + "px";
      labelEl.classList.add("on");
    }
  }

  const varCache = {};
  function getVar(name) {
    if (!varCache[name]) {
      varCache[name] = getComputedStyle(document.documentElement)
        .getPropertyValue(name).trim();
    }
    return varCache[name];
  }


  // ── Where the sun is ───────────────────────────────────────────────────────
  // NOAA's low-precision algorithm. Good to about a tenth of a degree, which is
  // far inside what "is it night there" needs, and it costs no network call.
  function solarElevation(lat, lon, now) {
    const start = Date.UTC(now.getUTCFullYear(), 0, 0);
    const day = Math.floor((now - start) / 86400000);
    const hour = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
    const f = (2 * Math.PI / 365) * (day - 1 + (hour - 12) / 24);
    const eqTime = 229.18 * (0.000075 + 0.001868 * Math.cos(f) - 0.032077 * Math.sin(f)
      - 0.014615 * Math.cos(2 * f) - 0.040849 * Math.sin(2 * f));
    const decl = 0.006918 - 0.399912 * Math.cos(f) + 0.070257 * Math.sin(f)
      - 0.006758 * Math.cos(2 * f) + 0.000907 * Math.sin(2 * f)
      - 0.002697 * Math.cos(3 * f) + 0.00148 * Math.sin(3 * f);
    const trueSolar = (hour * 60 + eqTime + 4 * lon + 1440) % 1440;
    const ha = (trueSolar / 4 - 180) * Math.PI / 180;
    const latR = lat * Math.PI / 180;
    const cosZ = Math.sin(latR) * Math.sin(decl)
      + Math.cos(latR) * Math.cos(decl) * Math.cos(ha);
    return Math.asin(Math.max(-1, Math.min(1, cosZ))) * 180 / Math.PI;
  }

  let sunDecl = 0, sunLonRad = 0, sunAt = 0;
  function updateSun(nowMs) {
    // The subsolar point moves 15 degrees an hour; recomputing it every frame
    // for every dot would be thousands of pointless trig calls a second.
    if (nowMs - sunAt < 20000 && sunAt) return;
    sunAt = nowMs;
    const now = new Date();
    const start = Date.UTC(now.getUTCFullYear(), 0, 0);
    const day = Math.floor((now - start) / 86400000);
    const hour = now.getUTCHours() + now.getUTCMinutes() / 60;
    const f = (2 * Math.PI / 365) * (day - 1 + (hour - 12) / 24);
    const eqTime = 229.18 * (0.000075 + 0.001868 * Math.cos(f) - 0.032077 * Math.sin(f)
      - 0.014615 * Math.cos(2 * f) - 0.040849 * Math.sin(2 * f));
    sunDecl = 0.006918 - 0.399912 * Math.cos(f) + 0.070257 * Math.sin(f)
      - 0.006758 * Math.cos(2 * f) + 0.000907 * Math.sin(2 * f)
      - 0.002697 * Math.cos(3 * f) + 0.00148 * Math.sin(3 * f);
    sunLonRad = -(hour * 60 + eqTime - 720) / 4 * Math.PI / 180;
  }

  function dotIsLit(d) {
    return d.sinLat * Math.sin(sunDecl)
      + d.cosLat * Math.cos(sunDecl) * Math.cos(d.lonRad - sunLonRad) > -0.105;
  }

  // ── Turning text and emoji into dot targets ────────────────────────────────
  const EMOJI = {
    dog:"🐕", cat:"🐈", heart:"❤️", star:"⭐", tree:"🌳", fish:"🐟", bird:"🐦",
    house:"🏠", home:"🏠", car:"🚗", plane:"✈️", rocket:"🚀", boat:"⛵",
    sun:"☀️", moon:"🌙", cloud:"☁️", rain:"🌧️", snow:"❄️", fire:"🔥",
    skull:"💀", ghost:"👻", alien:"👽", robot:"🤖", brain:"🧠", eye:"👁️",
    hand:"✋", flower:"🌸", leaf:"🍃", apple:"🍎", pizza:"🍕", coffee:"☕",
    beer:"🍺", cake:"🎂", gift:"🎁", key:"🔑", lock:"🔒", clock:"🕐",
    globe:"🌍", earth:"🌍", world:"🌍", map:"🗺️", anchor:"⚓", crown:"👑",
    diamond:"💎", music:"🎵", camera:"📷", phone:"📱", book:"📖", pencil:"✏️",
    lightning:"⚡", bolt:"⚡", umbrella:"☂️", balloon:"🎈", bomb:"💣",
    whale:"🐳", turtle:"🐢", snake:"🐍", horse:"🐴", cow:"🐄", pig:"🐖",
    bear:"🐻", panda:"🐼", monkey:"🐒", elephant:"🐘", butterfly:"🦋",
    spider:"🕷️", bee:"🐝", crab:"🦀", octopus:"🐙", penguin:"🐧",
    wow:"😮", smile:"🙂", sad:"🙁", love:"💖", peace:"✌️", ok:"👌",
    wave:"👋", eyes:"👀", tea:"🍵", sushi:"🍣", burger:"🍔", guitar:"🎸",
    football:"⚽", dice:"🎲", trophy:"🏆", rainbow:"🌈", volcano:"🌋",
    mountain:"⛰️", cactus:"🌵", mushroom:"🍄", magnet:"🧲",
  };

  const FONT_STACK =
    '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",' +
    '"Noto Sans","Noto Sans Devanagari","Noto Sans JP","Noto Sans SC",' +
    '"Noto Sans KR","Noto Sans Thai",system-ui,ui-monospace,monospace';

  const SUPER = 6;   // offscreen supersample per grid cell

  /**
   * Rasterise text inside a normalised box and return the grid cells it covers.
   * The box lets several lines of chat stack without each one taking the whole
   * screen.
   */
  function glyphTargets(text, box, minLit, screenSpace) {
    // The sampling lattice has to be square in whatever space it covers. The
    // map grid is 180x71 for a 2.57:1 box; reusing those counts over a tall
    // viewport squashes every letter vertically.
    const cols = grid.nCols;
    const rows = screenSpace
      ? Math.max(8, Math.round(cols * (cssH / Math.max(1, cssW))))
      : grid.nRows;
    const b = box || { x0: 0.03, y0: 0.14, x1: 0.97, y1: 0.86 };
    // Fraction of a cell that must be ink. Too high and thin strokes break up;
    // too low and neighbouring strokes merge into blobs, which is what turned
    // MATRIX into an unreadable smear. Letters want about half, silhouettes
    // want much less so they fill.
    const need = (minLit || 0.25) * 9;
    const off = document.createElement("canvas");
    off.width = cols * SUPER;
    off.height = rows * SUPER;
    const o = off.getContext("2d", { willReadFrequently: true });
    o.fillStyle = "#000";
    o.fillRect(0, 0, off.width, off.height);
    o.fillStyle = "#fff";
    o.textAlign = "center";
    o.textBaseline = "middle";

    const bx = b.x0 * off.width, by = b.y0 * off.height;
    const bw = (b.x1 - b.x0) * off.width, bh = (b.y1 - b.y0) * off.height;

    let size = bh;
    o.font = `900 ${size}px ${FONT_STACK}`;
    const w = o.measureText(text).width;
    if (w > bw) {
      size = Math.max(4, size * bw / w);
      o.font = `900 ${size}px ${FONT_STACK}`;
    }
    o.fillText(text, bx + bw / 2, by + bh / 2);

    const data = o.getImageData(0, 0, off.width, off.height).data;
    const targets = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let lit = 0;
        for (let sy2 = 1; sy2 < SUPER; sy2 += 2) {
          for (let sx2 = 1; sx2 < SUPER; sx2 += 2) {
            const i = ((r * SUPER + sy2) * off.width + (c * SUPER + sx2)) * 4;
            if (data[i] > 80 || data[i + 1] > 80 || data[i + 2] > 80) lit++;
          }
        }
        if (lit < need) continue;
        let gx = (c + 0.5) / cols, gy = (r + 0.5) / rows;
        if (screenSpace) {
          // The lattice covered the whole viewport; convert back to the map's
          // coordinate space, which is what the dots are drawn in.
          gx = (gx * cssW - view.x) / view.w;
          gy = (gy * cssH - view.y) / view.h;
        }
        targets.push({ gx, gy });
      }
    }
    return targets;
  }

  /** Move the dots onto a set of targets, starting from where they are now. */
  function setTargets(targets) {
    const n = dots.length;
    const used = new Uint8Array(n);
    for (const d of dots) {
      d.fx = d.cx; d.fy = d.cy;
      d.wasActive = d.active;
      d.active = false;
    }

    // Two passes. Dots that are already lit get first refusal on every target,
    // so one word hands its dots to the next instead of summoning faded ones
    // that are still parked on their continents.
    for (const onlyLit of [true, false]) {
      for (const t of targets) {
        if (t.taken) continue;
        let best = -1, bestD = Infinity;
        for (let i = 0; i < n; i++) {
          if (used[i]) continue;
          if (onlyLit && !dots[i].wasActive) continue;
          const dx = dots[i].cx - t.gx, dy = dots[i].cy - t.gy;
          const v = dx * dx + dy * dy;
          if (v < bestD) { bestD = v; best = i; }
        }
        if (best < 0) continue;
        used[best] = 1;
        t.taken = true;
        dots[best].tx = t.gx; dots[best].ty = t.gy; dots[best].active = true;
      }
    }

    // Leftovers fade out WHERE THEY ARE. Sending them home meant the world map
    // visibly reassembled between one greeting and the next, which is the very
    // thing the from-current-position change was supposed to stop.
    for (let i = 0; i < n; i++) {
      if (!used[i]) { dots[i].tx = dots[i].cx; dots[i].ty = dots[i].cy; }
    }
    morphStart = performance.now() / 1000;
  }

  function goHome() {
    for (const d of dots) {
      d.fx = d.cx; d.fy = d.cy;
      d.tx = d.hx; d.ty = d.hy;
      d.wasActive = d.active;   // dormant dots have to fade back in, not pop
      d.active = true;
    }
    morphStart = performance.now() / 1000;
  }

  function showGlyph(text, box) {
    const targets = glyphTargets(text, box);
    if (targets.length < 6) return false;   // nothing rendered — missing glyph
    setTargets(targets);
    marker = null;
    labelEl.classList.remove("on");
    return true;
  }

  function doShape(word) {
    const clean = (word || "").trim();
    if (!clean) return;
    const key = clean.toLowerCase().replace(/[^a-z]/g, "");
    const glyph = EMOJI[key] || EMOJI[key.replace(/s$/, "")];
    stopChat();
    chatLines = [];
    showGlyph(glyph || clean.toUpperCase().slice(0, 12));
    setStatus(glyph ? `${clean} ${glyph}` : clean);
  }

  // ── Chat: a transcript in dots, small, stacking down from the top ──────────
  const CHAT_MAX_LINES = 6;
  const CHAT_WRAP = 11;        // characters per dot line — fewer means bigger letters
  const CHAT_TOP = 0.07, CHAT_LINE = 0.125;  // fractions of SCREEN height

  /**
   * Chat is positioned against the SCREEN, not the map box. The map is
   * letterboxed inside a tall window, so anchoring the transcript to the map
   * would park it halfway down the page instead of at the top.
   */
  function chatTargets() {
    let all = [];
    const start = Math.max(0, chatLines.length - CHAT_MAX_LINES);
    const visible = chatLines.slice(start);
    visible.forEach((line, i) => {
      const y0 = CHAT_TOP + i * CHAT_LINE;
      all = all.concat(glyphTargets(line, {
        x0: 0.08, y0, x1: 0.92, y1: y0 + CHAT_LINE * 0.74,
      }, 0.5, true));   // letters need ~half a cell of ink to stay crisp
    });
    return all;
  }

  /** Break a reply into dot-width lines so a whole sentence stays legible. */
  function wrap(text, width) {
    const out = [];
    let line = "";
    for (const w of String(text).split(/\s+/).filter(Boolean)) {
      if (!line) { line = w; continue; }
      if ((line + " " + w).length <= width) line += " " + w;
      else { out.push(line); line = w; }
    }
    if (line) out.push(line);
    return out;
  }

  function pushChatLine(text) {
    const reply = String(text || "").trim();
    if (!reply) { setStatus("nothing to say"); return; }
    // The marker's crosshair would sit on top of the transcript.
    marker = null;
    labelEl.classList.remove("on");

    for (const line of wrap(reply, CHAT_WRAP)) {
      chatLines.push(line);
      if (chatLines.length > CHAT_MAX_LINES) chatLines.shift();
    }
    setTargets(chatTargets());
    setStatus(reply);
  }

  function stopChat() { clearTimeout(chatTimer); }

  // ── Reverse ────────────────────────────────────────────────────────────────
  function toggleReverse() {
    reversed = !reversed;
    marker = null;
    chatLines = [];
    labelEl.classList.remove("on");
    buildDots();
    setStatus(reversed ? "reversed — the sea is the ink now" : "");
  }


  // ── Live data drawn over the map ───────────────────────────────────────────
  function drawOverlay(t, r) {
    if (!overlay || !overlay.points.length) return;
    const accent = getVar("--accent");
    for (const pt of overlay.points) {
      const x = sx((pt.lon + 180) / 360);
      const y = sy((grid.latMax - pt.lat) / (grid.latMax - grid.latMin));
      if (x < -20 || x > cssW + 20) continue;

      // Magnitude, aurora strength or percent move sets the RING, never the
      // dot: an inflated dot claims the event covers more ground than it does.
      const ring = r * 2 + (pt.value || 0) * view.cell * 0.9;
      const cycle = ((t * 0.55) + (pt.lon + pt.lat) * 0.01) % 1;
      ctx.beginPath();
      ctx.arc(x, y, ring * (0.6 + cycle * 0.9), 0, Math.PI * 2);
      ctx.strokeStyle = accent;
      ctx.globalAlpha = 0.5 * (1 - cycle);
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(x, y, r * 1.15, 0, Math.PI * 2);
      ctx.globalAlpha = pt.on === false ? 0.35 : 1;
      ctx.fillStyle = accent;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function showOverlay(kind, points, summary) {
    stopIntro();
    chatLines = [];
    marker = null;
    labelEl.classList.remove("on");
    goHome();
    overlay = { kind, points, summary };
    setStatus(summary || kind);
  }

  // ── Intents ────────────────────────────────────────────────────────────────
  function applyIntent(intent) {
    if (!intent || !intent.intent) return;
    switch (intent.intent) {
      case "locate":
        overlay = null;
        stopChat(); chatLines = []; goHome();
        return doLocate(intent.params || {});
      case "aurora": {
        const q = intent.params || {};
        return showOverlay("aurora",
          (q.visible || []).map((v) => ({
            lon: v.lon, lat: v.lat, value: v.prob / 60,
          })), q.summary);
      }
      case "markets": {
        const q = intent.params || {};
        return showOverlay("markets",
          (q.markets || []).map((m) => ({
            lon: m.lon, lat: m.lat,
            value: Math.min(3, Math.abs(m.change_pct || 0)) / 3,
            on: m.open_now,
          })), q.summary);
      }
      case "quakes": {
        const q = intent.params || {};
        return showOverlay("quakes",
          (q.quakes || []).map((k) => ({
            lon: k.lon, lat: k.lat, value: Math.max(0, (k.mag - 2)) / 5,
          })), q.summary);
      }
      case "shape":
        overlay = null;
        return doShape((intent.params || {}).word);
      case "chat":
        overlay = null;
        return pushChatLine((intent.params || {}).reply);
      case "reverse":
        stopChat();
        return toggleReverse();
      case "idle":
      default:
        marker = null; overlay = null; stopChat(); chatLines = []; thread = []; goHome();
        labelEl.classList.remove("on");
        setStatus("");
    }
  }

  function markAt(lon, lat, label) {
    const index = nearestDot(lon, lat);
    if (index < 0) { setStatus("no land near there"); return; }
    marker = { index, born: performance.now() / 1000, label };
    const id = dots[index].country;
    const country = id >= 0 && grid.countries[id] ? grid.countries[id].name : null;
    if (!marker.label) marker.label = country || "here";
    setStatus(country || "found it");
  }

  async function doLocate(params) {
    if (typeof params.lat === "number" && typeof params.lon === "number") {
      markAt(params.lon, params.lat, params.label);
      return;
    }
    setStatus("finding you", true);
    const viaBrowser = await new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        () => resolve(null),
        { timeout: 8000, maximumAge: 600000 }
      );
    });
    if (viaBrowser) { markAt(viaBrowser.lon, viaBrowser.lat, "you are here"); return; }
    try {
      const res = await fetch("/api/whereami");
      const d = await res.json();
      if (typeof d.lat === "number") { markAt(d.lon, d.lat, d.city || "about here"); return; }
    } catch (_) { /* fall through */ }
    setStatus("couldn’t work out where you are");
  }

  // ── Director ───────────────────────────────────────────────────────────────
  // The thread lives here, not on the server, so the reply can follow the
  // conversation without the backend holding per-visitor state.
  let thread = [];

  async function send(text) {
    stopIntro();
    setStatus("reading that", true);
    try {
      const res = await fetch("/api/intent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, history: thread.slice(-4) }),
      });
      if (!res.ok) throw new Error("intent " + res.status);
      const intent = await res.json();
      if (intent.intent === "chat") {
        thread.push({ you: text, map: (intent.params || {}).reply || "" });
        if (thread.length > 8) thread.shift();
      }
      applyIntent(intent);
    } catch (err) {
      setStatus("no answer from the server");
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    updateHint();
    send(text);
  });

  // ── Hints ──────────────────────────────────────────────────────────────────
  const HINTS = [
    "where can i see the aurora tonight", "which markets are open right now",
    "earthquakes near japan", "show my location", "how is asia doing",
    "draw a dog", "talk to me", "reverse", "51.5, -0.12",
  ];
  let hintIndex = 0;
  function updateHint() {
    hintEl.textContent = input.value ? "" : HINTS[hintIndex % HINTS.length];
  }
  function cycleHint() {
    if (input.value) return;
    hintEl.classList.add("out");
    setTimeout(() => { hintIndex++; updateHint(); hintEl.classList.remove("out"); }, 450);
  }
  input.addEventListener("input", updateHint);
  setInterval(cycleHint, 3800);

  // ── Hello, on a loop, in its own script ────────────────────────────────────
  // native is drawn; latin is what the status line says, so the greeting is
  // always readable even when the viewer's machine lacks the font.
  const GREETINGS = [
    { native: "HELLO",      latin: "hello",      lang: "english" },
    { native: "नमस्ते",       latin: "namaste",    lang: "hindi" },
    { native: "CIAO",       latin: "ciao",       lang: "italian" },
    { native: "HOLA",       latin: "hola",       lang: "spanish" },
    { native: "BONJOUR",    latin: "bonjour",    lang: "french" },
    { native: "HALLO",      latin: "hallo",      lang: "german" },
    { native: "OLÁ",        latin: "ola",        lang: "portuguese" },
    { native: "Привет",     latin: "privet",     lang: "russian" },
    { native: "你好",        latin: "ni hao",     lang: "chinese" },
    { native: "こんにちは",    latin: "konnichiwa", lang: "japanese" },
    { native: "안녕하세요",    latin: "annyeong",   lang: "korean" },
    { native: "สวัสดี",       latin: "sawasdee",   lang: "thai" },
    { native: "Γεια σου",   latin: "yia sou",    lang: "greek" },
    { native: "CZEŚĆ",      latin: "czesc",      lang: "polish" },
    { native: "HEJ",        latin: "hej",        lang: "swedish" },
    { native: "HEI",        latin: "hei",        lang: "norwegian" },
    { native: "MOI",        latin: "moi",        lang: "finnish" },
    { native: "AHOJ",       latin: "ahoj",       lang: "czech" },
    { native: "SZIA",       latin: "szia",       lang: "hungarian" },
    { native: "ZDRAVO",     latin: "zdravo",     lang: "croatian" },
    { native: "SALUT",      latin: "salut",      lang: "romanian" },
    { native: "XIN CHÀO",   latin: "xin chao",   lang: "vietnamese" },
    { native: "HALO",       latin: "halo",       lang: "indonesian" },
    { native: "KAMUSTA",    latin: "kamusta",    lang: "filipino" },
    { native: "JAMBO",      latin: "jambo",      lang: "swahili" },
    { native: "SAWUBONA",   latin: "sawubona",   lang: "zulu" },
    { native: "ALOHA",      latin: "aloha",      lang: "hawaiian" },
    { native: "KIA ORA",    latin: "kia ora",    lang: "maori" },
    { native: "নমস্কার",      latin: "nomoskar",   lang: "bengali" },
    { native: "ਸਤ ਸ੍ਰੀ ਅਕਾਲ",  latin: "sat sri akal", lang: "punjabi" },
  ];

  let greetIndex = 0;
  function startIntro() {
    const order = GREETINGS.slice().sort(() => Math.random() - 0.5);
    const step = () => {
      const g = order[greetIndex % order.length];
      greetIndex++;
      // If the machine has no font for the script, nothing renders — say it in
      // Latin rather than showing an empty screen.
      if (!showGlyph(g.native)) showGlyph(g.latin.toUpperCase());
      setStatus(`${g.latin} · ${g.lang}`);
      introTimer = setTimeout(step, MORPH_SECONDS > 3 ? 9000 : 2600);
    };
    step();
  }

  function stopIntro() {
    if (introTimer) { clearTimeout(introTimer); introTimer = null; }
  }

  new ResizeObserver(layout).observe(canvas);
  window.addEventListener("resize", layout);

  loadGrid()
    .then(() => {
      requestAnimationFrame(draw);
      updateHint();
      setTimeout(startIntro, 400);
    })
    .catch(() => setStatus("the map did not load"));
})();
</script>
</body>
</html>
