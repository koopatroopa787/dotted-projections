<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dotted Projections</title>
<style>
  :root {
    --bg: #ffffff;
    --dot: #111418;
    --accent: #d4541e;
    --text: #9aa3ad;
    --text-bright: #1a1f25;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #map { display: block; width: 100vw; height: 100vh; }

  /* The bar is not a box on the page — it is a line of text that happens to
     accept typing. No border, no fill, no shadow. */
  #console {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(7vh, 44px);
    width: min(640px, calc(100vw - 48px));
    display: flex;
    align-items: baseline;
    gap: 12px;
    pointer-events: auto;
  }
  #console::before {
    content: "";
    position: absolute;
    left: -8%;
    right: -8%;
    top: -240%;
    bottom: -180%;
    /* Fades the dot field out behind the text so it stays readable without
       drawing a panel over the map. */
    background: radial-gradient(ellipse at center,
      rgba(255,255,255,.97) 0%, rgba(255,255,255,.9) 42%, rgba(255,255,255,0) 74%);
    pointer-events: none;
    z-index: -1;
  }
  #caret { color: var(--accent); font-size: 15px; line-height: 1; opacity: .9; }
  #cmd {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text-bright);
    font: inherit;
    font-size: 15px;
    letter-spacing: .01em;
    padding: 2px 0;
  }
  #cmd::placeholder { color: transparent; }

  /* The rotating hint sits under the real input, so the placeholder can
     animate without fighting the browser's own placeholder rendering. */
  #hint {
    position: absolute;
    left: 27px;
    bottom: 2px;
    font-size: 15px;
    color: #b9c0c8;
    pointer-events: none;
    transition: opacity .45s ease, transform .45s ease;
    white-space: nowrap;
  }
  #hint.out { opacity: 0; transform: translateY(-4px); }
  #rule {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(max(7vh, 44px) - 10px);
    width: min(640px, calc(100vw - 48px));
    height: 1px;
    background: linear-gradient(to right,
      rgba(0,0,0,0), rgba(0,0,0,.16) 12%, rgba(0,0,0,.16) 88%, rgba(0,0,0,0));
  }

  #status {
    position: fixed;
    top: max(22px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--text);
    pointer-events: none;
    white-space: nowrap;
    transition: opacity .4s ease;
  }
  #label {
    position: fixed;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s ease;
    white-space: nowrap;
  }
  #label.on { opacity: 1; }
  .spin { display: inline-block; animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none } }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="status"></div>
<div id="label"></div>
<div id="rule"></div>
<form id="console" autocomplete="off">
  <span id="caret">›</span>
  <input id="cmd" name="cmd" aria-label="type anything">
  <span id="hint"></span>
</form>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d", { alpha: false });
  const statusEl = document.getElementById("status");
  const labelEl = document.getElementById("label");
  const hintEl = document.getElementById("hint");
  const form = document.getElementById("console");
  const input = document.getElementById("cmd");

  const setStatus = (t, busy) => {
    statusEl.innerHTML = busy ? `<span class="spin">•</span> ${t}` : (t || "");
  };

  // ── State ──────────────────────────────────────────────────────────────────
  let grid = null;
  let dots = [];
  let landCells = null;       // Set of "col,row" — used to build the inverse
  let reversed = false;
  let view = { x: 0, y: 0, w: 1, h: 1, cell: 1 };
  let marker = null;
  let morph = null;
  let dpr = 1;
  let cssW = 0, cssH = 0;
  let introTimer = null;

  // ── Projection ─────────────────────────────────────────────────────────────
  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.max(1, Math.round(rect.height));
    cssW = w; cssH = h;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!grid) return;
    const spanLon = 360, spanLat = grid.latMax - grid.latMin;
    const aspect = spanLon / spanLat;
    const pad = 0.94;
    let vw = w * pad, vh = vw / aspect;
    if (vh > h * pad) { vh = h * pad; vw = vh * aspect; }
    view = {
      x: (w - vw) / 2, y: (h - vh) / 2, w: vw, h: vh,
      cell: vw / (spanLon / grid.step),
    };
  }

  const project = (lon, lat) => ({
    x: view.x + ((lon + 180) / 360) * view.w,
    y: view.y + ((grid.latMax - lat) / (grid.latMax - grid.latMin)) * view.h,
  });

  // ── Data ───────────────────────────────────────────────────────────────────
  function makeDot(col, row, countryId) {
    const lon = grid.lonMin + col * grid.step;
    const lat = grid.latMax - row * grid.step;
    return {
      lon, lat, country: countryId,
      phase: (Math.sin(lon * 12.9898 + lat * 78.233) * 43758.5453) % (Math.PI * 2),
      tgx: null, tgy: null,
    };
  }

  function buildDots() {
    if (!reversed) {
      dots = new Array(grid.count);
      for (let i = 0; i < grid.count; i++) {
        dots[i] = makeDot(grid.cols[i], grid.rows[i], grid.countryIds[i]);
      }
      return;
    }
    // Reverse: the sea becomes the dots and the land becomes the hole, so the
    // same continents read as negative space.
    const out = [];
    for (let r = 0; r < grid.nRows; r++) {
      for (let c = 0; c < grid.nCols; c++) {
        if (!landCells.has(c + "," + r)) out.push(makeDot(c, r, -1));
      }
    }
    dots = out;
  }

  async function loadGrid() {
    const res = await fetch("dots.json");
    if (!res.ok) throw new Error("dots.json " + res.status);
    grid = await res.json();
    landCells = new Set();
    for (let i = 0; i < grid.count; i++) {
      landCells.add(grid.cols[i] + "," + grid.rows[i]);
    }
    buildDots();
    layout();
  }

  function nearestDot(lon, lat) {
    let best = -1, bestD = Infinity;
    for (let i = 0; i < dots.length; i++) {
      let dLon = Math.abs(dots[i].lon - lon);
      if (dLon > 180) dLon = 360 - dLon;
      const dx = dLon * Math.cos((lat * Math.PI) / 180);
      const dy = dots[i].lat - lat;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  const DRIFT_RATIO = 0.05;
  const MORPH_SECONDS = 1.15;
  const DOT_RATIO = 0.30;      // radius as a share of pitch

  function draw(now) {
    const t = now / 1000;
    ctx.fillStyle = getVar("--bg");
    ctx.fillRect(0, 0, cssW, cssH);

    if (grid) {
      const r = Math.max(0.6, view.cell * DOT_RATIO);
      const drift = view.cell * DRIFT_RATIO;

      let m = 0;
      if (morph) {
        const raw = Math.min(1, (t - morph.born) / MORPH_SECONDS);
        const eased = raw < 0.5 ? 4 * raw ** 3 : 1 - (-2 * raw + 2) ** 3 / 2;
        m = morph.dir === 1 ? eased : 1 - eased;
        if (raw >= 1 && morph.dir === -1) morph = null;
      }

      const path = new Path2D();
      const spare = new Path2D();
      for (let i = 0; i < dots.length; i++) {
        const d = dots[i];
        const p = project(d.lon, d.lat);
        let x = p.x + Math.sin(t * 0.55 + d.phase) * drift;
        let y = p.y + Math.cos(t * 0.41 + d.phase * 1.7) * drift;
        if (m > 0 && d.tgx != null) {
          x += (view.x + d.tgx * view.w - x) * m;
          y += (view.y + d.tgy * view.h - y) * m;
        }
        const into = (m > 0 && d.tgx == null) ? spare : path;
        into.moveTo(x + r, y);
        into.arc(x, y, r, 0, Math.PI * 2);
      }
      ctx.fillStyle = getVar("--dot");
      ctx.fill(path);
      if (m > 0) {
        ctx.globalAlpha = Math.max(0, 1 - m * 1.6);   // leftovers clear out fully
        ctx.fill(spare);
        ctx.globalAlpha = 1;
      }

      if (marker) drawMarker(t, r);
    }
    requestAnimationFrame(draw);
  }

  function drawMarker(t, r) {
    const d = dots[marker.index];
    if (!d) return;
    const p = project(d.lon, d.lat);
    const pulse = 0.7 + 0.3 * Math.sin((t - marker.born) * 3.0);
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = getVar("--accent");
    ctx.fill();
    ctx.globalAlpha = 1;

    if (marker.label) {
      labelEl.textContent = marker.label;
      labelEl.style.left = (p.x + r + 8) + "px";
      labelEl.style.top = (p.y - 6) + "px";
      labelEl.classList.add("on");
    }
  }

  const varCache = {};
  function getVar(name) {
    if (!varCache[name]) {
      varCache[name] = getComputedStyle(document.documentElement)
        .getPropertyValue(name).trim();
    }
    return varCache[name];
  }

  // ── Shapes ─────────────────────────────────────────────────────────────────
  const EMOJI = {
    dog:"🐕", cat:"🐈", heart:"❤️", star:"⭐", tree:"🌳", fish:"🐟", bird:"🐦",
    house:"🏠", home:"🏠", car:"🚗", plane:"✈️", rocket:"🚀", boat:"⛵",
    sun:"☀️", moon:"🌙", cloud:"☁️", rain:"🌧️", snow:"❄️", fire:"🔥",
    skull:"💀", ghost:"👻", alien:"👽", robot:"🤖", brain:"🧠", eye:"👁️",
    hand:"✋", flower:"🌸", leaf:"🍃", apple:"🍎", pizza:"🍕", coffee:"☕",
    beer:"🍺", cake:"🎂", gift:"🎁", key:"🔑", lock:"🔒", clock:"🕐",
    globe:"🌍", earth:"🌍", world:"🌍", map:"🗺️", anchor:"⚓", crown:"👑",
    diamond:"💎", music:"🎵", camera:"📷", phone:"📱", book:"📖", pencil:"✏️",
    lightning:"⚡", bolt:"⚡", umbrella:"☂️", balloon:"🎈", bomb:"💣",
    whale:"🐳", turtle:"🐢", snake:"🐍", horse:"🐴", cow:"🐄", pig:"🐖",
    bear:"🐻", panda:"🐼", monkey:"🐒", elephant:"🐘", butterfly:"🦋",
    spider:"🕷️", bee:"🐝", crab:"🦀", octopus:"🐙", penguin:"🐧",
    wow:"😮", smile:"🙂", sad:"🙁", love:"💖", peace:"✌️", ok:"👌",
    thumbsup:"👍", wave:"👋", eyes:"👀", zap:"⚡", tea:"🍵", sushi:"🍣",
    burger:"🍔", icecream:"🍦", guitar:"🎸", football:"⚽", chess:"♟️",
    dice:"🎲", trophy:"🏆", medal:"🏅", rainbow:"🌈", wave2:"🌊", volcano:"🌋",
    mountain:"⛰️", cactus:"🌵", mushroom:"🍄", ghost2:"👾", magnet:"🧲",
  };

  function glyphTargets(text) {
    const cols = grid.nCols, rows = grid.nRows;
    const S = 6;
    const off = document.createElement("canvas");
    off.width = cols * S;
    off.height = rows * S;
    const octx = off.getContext("2d", { willReadFrequently: true });
    octx.fillStyle = "#000";
    octx.fillRect(0, 0, off.width, off.height);
    octx.fillStyle = "#fff";
    octx.textAlign = "center";
    octx.textBaseline = "middle";

    let size = off.height * 0.86;
    const font = (s) =>
      `900 ${s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",ui-monospace,monospace`;
    octx.font = font(size);
    const w = octx.measureText(text).width;
    if (w > off.width * 0.9) {
      size = size * (off.width * 0.9) / w;
      octx.font = font(size);
    }
    octx.fillText(text, off.width / 2, off.height / 2);

    const data = octx.getImageData(0, 0, off.width, off.height).data;
    const targets = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let lit = 0;
        for (let sy = 1; sy < S; sy += 2) {
          for (let sx = 1; sx < S; sx += 2) {
            const i = ((r * S + sy) * off.width + (c * S + sx)) * 4;
            if (data[i] > 80 || data[i + 1] > 80 || data[i + 2] > 80) lit++;
          }
        }
        if (lit >= 2) targets.push({ gx: (c + 0.5) / cols, gy: (r + 0.5) / rows });
      }
    }
    return targets;
  }

  function assignTargets(targets) {
    for (const d of dots) { d.tgx = null; d.tgy = null; }

    // Each target claims its nearest still-free dot. Rank-order assignment
    // (sort both sides, pair them off) is cheaper but smears the glyph: the
    // dots are distributed like continents and the targets like letters, so
    // matching them by rank stretches one onto the other.
    const hx = new Float32Array(dots.length);
    const hy = new Float32Array(dots.length);
    for (let i = 0; i < dots.length; i++) {
      hx[i] = (dots[i].lon + 180) / 360;
      hy[i] = (grid.latMax - dots[i].lat) / (grid.latMax - grid.latMin);
    }
    const used = new Uint8Array(dots.length);
    let placed = 0;
    for (const t of targets) {
      let best = -1, bestD = Infinity;
      for (let i = 0; i < dots.length; i++) {
        if (used[i]) continue;
        const dx = hx[i] - t.gx, dy = hy[i] - t.gy;
        const v = dx * dx + dy * dy;
        if (v < bestD) { bestD = v; best = i; }
      }
      if (best < 0) break;
      used[best] = 1;
      dots[best].tgx = t.gx;
      dots[best].tgy = t.gy;
      placed++;
    }
    return placed;
  }

  function showGlyph(text, label) {
    const targets = glyphTargets(text);
    if (!targets.length) return false;
    assignTargets(targets);
    morph = { dir: 1, born: performance.now() / 1000 };
    marker = null;
    labelEl.classList.remove("on");
    if (label !== undefined) setStatus(label);
    return true;
  }

  function doShape(word) {
    const clean = (word || "").trim();
    if (!clean) return;
    const key = clean.toLowerCase().replace(/[^a-z]/g, "");
    const glyph = EMOJI[key] || EMOJI[key.replace(/s$/, "")];
    // Every word draws something: its emoji if it has one, otherwise itself.
    showGlyph(glyph || clean.toUpperCase().slice(0, 12),
              glyph ? `${clean} ${glyph}` : clean);
  }

  function releaseShape() {
    if (morph && morph.dir === 1) morph = { dir: -1, born: performance.now() / 1000 };
  }

  // ── Chat: the reply is spelled out, one word at a time ──────────────────────
  let sayTimer = null;
  function sayWords(reply) {
    clearTimeout(sayTimer);
    const words = String(reply || "").split(/\s+/).filter(Boolean);
    if (!words.length) { setStatus("nothing to say"); return; }
    let k = 0;
    const step = () => {
      if (k >= words.length) {
        sayTimer = setTimeout(() => { releaseShape(); setStatus(""); }, 1400);
        return;
      }
      showGlyph(words[k], reply);
      k++;
      sayTimer = setTimeout(step, 1500);
    };
    step();
  }

  // ── Reverse ────────────────────────────────────────────────────────────────
  function toggleReverse() {
    reversed = !reversed;
    morph = null;
    marker = null;
    labelEl.classList.remove("on");
    buildDots();
    setStatus(reversed ? "reversed — the sea is the ink now" : "");
  }

  // ── Intents ────────────────────────────────────────────────────────────────
  function applyIntent(intent) {
    if (!intent || !intent.intent) return;
    switch (intent.intent) {
      case "locate":
        releaseShape();
        return doLocate(intent.params || {});
      case "shape":
        return doShape((intent.params || {}).word);
      case "chat":
        return sayWords((intent.params || {}).reply);
      case "reverse":
        releaseShape();
        return toggleReverse();
      case "idle":
      default:
        marker = null;
        releaseShape();
        labelEl.classList.remove("on");
        setStatus("");
    }
  }

  function markAt(lon, lat, label) {
    const index = nearestDot(lon, lat);
    if (index < 0) { setStatus("no land near there"); return; }
    marker = { index, born: performance.now() / 1000, label };
    const id = dots[index].country;
    const country = id >= 0 && grid.countries[id] ? grid.countries[id].name : null;
    setStatus(label || country || "found it");
  }

  async function doLocate(params) {
    if (typeof params.lat === "number" && typeof params.lon === "number") {
      markAt(params.lon, params.lat, params.label);
      return;
    }
    setStatus("finding you", true);
    const viaBrowser = await new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        () => resolve(null),
        { timeout: 8000, maximumAge: 600000 }
      );
    });
    if (viaBrowser) { markAt(viaBrowser.lon, viaBrowser.lat, "you"); return; }
    try {
      const res = await fetch("/api/whereami");
      const d = await res.json();
      if (typeof d.lat === "number") { markAt(d.lon, d.lat, d.city || "about here"); return; }
    } catch (_) { /* fall through */ }
    setStatus("couldn’t work out where you are");
  }

  // ── Director ───────────────────────────────────────────────────────────────
  async function send(text) {
    stopIntro();
    setStatus("reading that", true);
    try {
      const res = await fetch("/api/intent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error("intent " + res.status);
      applyIntent(await res.json());
    } catch (err) {
      setStatus("no answer from the server");
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    updateHint();
    send(text);
  });

  // ── Hints ──────────────────────────────────────────────────────────────────
  const HINTS = [
    "show my location", "draw a dog", "draw a cat", "talk to me",
    "reverse", "spell your name", "a rocket", "51.5, -0.12",
  ];
  let hintIndex = 0;
  function updateHint() {
    hintEl.textContent = input.value ? "" : HINTS[hintIndex % HINTS.length];
  }
  function cycleHint() {
    if (input.value) return;
    hintEl.classList.add("out");
    setTimeout(() => {
      hintIndex++;
      updateHint();
      hintEl.classList.remove("out");
    }, 450);
  }
  input.addEventListener("input", updateHint);
  setInterval(cycleHint, 3800);

  // ── Intro: hello, going round the world ────────────────────────────────────
  const GREETINGS = [
    ["HELLO", "english"], ["NAMASTE", "hindi"], ["CIAO", "italian"],
    ["HOLA", "spanish"], ["BONJOUR", "french"], ["HALLO", "german"],
    ["OLA", "portuguese"], ["PRIVET", "russian"], ["NI HAO", "chinese"],
    ["KONNICHIWA", "japanese"], ["ANNYEONG", "korean"], ["HEJ", "swedish"],
    ["JAMBO", "swahili"], ["ALOHA", "hawaiian"], ["KIA ORA", "maori"],
    ["SAWASDEE", "thai"], ["ZDRAVO", "croatian"], ["AHOJ", "czech"],
    ["SZIA", "hungarian"], ["XIN CHAO", "vietnamese"],
  ];

  function startIntro() {
    let k = 0;
    const order = GREETINGS.slice().sort(() => Math.random() - 0.5);
    const step = () => {
      if (k >= 5) {           // five hellos, then settle into the map
        releaseShape();
        setStatus("");
        introTimer = null;
        return;
      }
      const [word, lang] = order[k];
      showGlyph(word, `${word.toLowerCase()} · ${lang}`);
      k++;
      introTimer = setTimeout(step, 1700);
    };
    step();
  }

  function stopIntro() {
    if (introTimer) { clearTimeout(introTimer); introTimer = null; }
    clearTimeout(sayTimer);
  }

  new ResizeObserver(layout).observe(canvas);
  window.addEventListener("resize", layout);

  loadGrid()
    .then(() => {
      requestAnimationFrame(draw);
      updateHint();
      setTimeout(startIntro, 500);
    })
    .catch(() => setStatus("the map did not load"));
})();
</script>
</body>
</html>
