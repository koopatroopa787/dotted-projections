<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dotted Projections</title>
<style>
  :root {
    --bg: #080b11;
    --dot: #2f3d52;
    --dot-lit: #46597a;
    --accent: #ffb454;
    --accent-soft: rgba(255, 180, 84, 0.18);
    --text: #7c8ba3;
    --text-bright: #c6d2e3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #map { display: block; width: 100vw; height: 100vh; }

  /* Chrome stays out of the way — the map is the interface. */
  #console {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(28px, env(safe-area-inset-bottom));
    width: min(560px, calc(100vw - 32px));
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(10, 14, 21, 0.72);
    border: 1px solid rgba(124, 139, 163, 0.18);
    border-radius: 2px;
    backdrop-filter: blur(8px);
  }
  #console::before {
    content: "›";
    color: var(--accent);
    font-size: 14px;
    line-height: 1;
  }
  #cmd {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text-bright);
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  #cmd::placeholder { color: rgba(124, 139, 163, 0.5); }

  #status {
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text);
    opacity: 0.55;
    pointer-events: none;
    white-space: nowrap;
  }
  #label {
    position: fixed;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s ease;
    text-shadow: 0 0 12px rgba(0,0,0,.9);
    white-space: nowrap;
  }
  #label.on { opacity: 1; }
  .spin { display: inline-block; animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none } }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="status">loading the map</div>
<div id="label"></div>
<form id="console" autocomplete="off">
  <input id="cmd" name="cmd" placeholder="show my location" aria-label="command">
</form>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d", { alpha: false });
  const statusEl = document.getElementById("status");
  const labelEl = document.getElementById("label");
  const form = document.getElementById("console");
  const input = document.getElementById("cmd");

  const setStatus = (t, busy) => {
    statusEl.innerHTML = busy ? `<span class="spin">•</span> ${t}` : t;
  };

  // ── State ──────────────────────────────────────────────────────────────────
  let grid = null;      // dots.json
  let dots = [];        // { lon, lat, country, phase, hx, hy } in grid space
  let view = { x: 0, y: 0, w: 1, h: 1, cell: 1 };
  let marker = null;    // { lon, lat, index, born, label }
  let morph = null;     // { dir: 1 into shape, -1 back to map, born }
  let dpr = 1;

  // ── Projection ─────────────────────────────────────────────────────────────
  // Equirectangular. The grid is cropped in latitude, so the drawn box is
  // 360deg wide by (latMax-latMin) tall — not the usual 2:1.
  let cssW = 0, cssH = 0;

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    // Measure the element, not the window: under page zoom the two disagree
    // (100vw can resolve to 1280 while innerWidth reports 456), and sizing the
    // drawing from the window then stretches it across a differently-sized
    // canvas.
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.max(1, Math.round(rect.height));
    cssW = w; cssH = h;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!grid) return;
    const spanLon = 360, spanLat = grid.latMax - grid.latMin;
    const aspect = spanLon / spanLat;
    // Fill the viewport while keeping geography undistorted.
    const pad = 0.945;
    let vw = w * pad, vh = vw / aspect;
    if (vh > h * pad) { vh = h * pad; vw = vh * aspect; }
    view = { x: (w - vw) / 2, y: (h - vh) / 2, w: vw, h: vh, cell: vw / (spanLon / grid.step) };
  }

  const project = (lon, lat) => ({
    x: view.x + ((lon + 180) / 360) * view.w,
    y: view.y + ((grid.latMax - lat) / (grid.latMax - grid.latMin)) * view.h,
  });

  // ── Data ───────────────────────────────────────────────────────────────────
  async function loadGrid() {
    const res = await fetch("dots.json");
    if (!res.ok) throw new Error("dots.json " + res.status);
    grid = await res.json();

    dots = new Array(grid.count);
    for (let i = 0; i < grid.count; i++) {
      const lon = grid.lonMin + grid.cols[i] * grid.step;
      const lat = grid.latMax - grid.rows[i] * grid.step;
      dots[i] = {
        lon, lat,
        country: grid.countryIds[i],
        // Deterministic per-dot phase so the drift looks organic, not uniform.
        phase: (Math.sin(lon * 12.9898 + lat * 78.233) * 43758.5453) % (Math.PI * 2),
      };
    }
    layout();
  }

  function nearestDot(lon, lat) {
    // Longitude wraps; compare on the short way round.
    let best = -1, bestD = Infinity;
    for (let i = 0; i < dots.length; i++) {
      let dLon = Math.abs(dots[i].lon - lon);
      if (dLon > 180) dLon = 360 - dLon;
      // Degrees of longitude shrink toward the poles.
      const dx = dLon * Math.cos((lat * Math.PI) / 180);
      const dy = dots[i].lat - lat;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  // Drift scales with the dot pitch: a fixed pixel wander is invisible on a
  // coarse grid and jittery on a fine one.
  const DRIFT_RATIO = 0.045;
  const MORPH_SECONDS = 1.15;

  function draw(now) {
    const t = now / 1000;
    const w = cssW, h = cssH;

    ctx.fillStyle = getVar("--bg");
    ctx.fillRect(0, 0, w, h);

    if (grid) {
      // Reference image has dots very nearly touching: diameter ~0.8 of pitch.
      const r = Math.max(0.7, view.cell * 0.40);
      const drift = view.cell * DRIFT_RATIO;

      // Morph progress: 0 = map, 1 = shape. Eased both ways.
      let m = 0;
      if (morph) {
        const raw = Math.min(1, (t - morph.born) / MORPH_SECONDS);
        const eased = raw < 0.5 ? 4 * raw ** 3 : 1 - (-2 * raw + 2) ** 3 / 2;
        m = morph.dir === 1 ? eased : 1 - eased;
        if (raw >= 1 && morph.dir === -1) morph = null;
      }

      // Two paths: dots that belong to the shape, and dots left over. Leftovers
      // fade rather than piling up somewhere arbitrary.
      const path = new Path2D();
      const spare = new Path2D();
      for (let i = 0; i < dots.length; i++) {
        const d = dots[i];
        const p = project(d.lon, d.lat);
        const wob = Math.sin(t * 0.55 + d.phase) * drift;
        const wob2 = Math.cos(t * 0.41 + d.phase * 1.7) * drift;
        let x = p.x + wob, y = p.y + wob2;

        const inShape = m > 0 && d.tgx != null;
        if (inShape) {
          x += (view.x + d.tgx * view.w - x) * m;
          y += (view.y + d.tgy * view.h - y) * m;
        }
        const target = (m > 0 && d.tgx == null) ? spare : path;
        target.moveTo(x + r, y);
        target.arc(x, y, r, 0, Math.PI * 2);
      }
      ctx.fillStyle = getVar("--dot");
      ctx.fill(path);
      if (m > 0) {
        ctx.globalAlpha = 1 - m * 0.88;
        ctx.fill(spare);
        ctx.globalAlpha = 1;
      }

      if (marker) drawMarker(t, r);
    }
    requestAnimationFrame(draw);
  }

  function drawMarker(t, r) {
    const d = dots[marker.index];
    if (!d) return;
    const p = project(d.lon, d.lat);

    // One dot, lit — same size as every other. Growing it or glowing its
    // neighbours makes the marked place look physically bigger than it is,
    // which on a map is a lie about area.
    const pulse = 0.72 + 0.28 * Math.sin((t - marker.born) * 3.0);
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = getVar("--accent");
    ctx.fill();
    ctx.globalAlpha = 1;

    if (marker.label) {
      labelEl.textContent = marker.label;
      labelEl.style.left = (p.x + r + 8) + "px";
      labelEl.style.top = (p.y - 6) + "px";
      labelEl.classList.add("on");
    }
  }

  const varCache = {};
  function getVar(name) {
    if (!varCache[name]) {
      varCache[name] = getComputedStyle(document.documentElement)
        .getPropertyValue(name).trim();
    }
    return varCache[name];
  }

  // ── Shapes ─────────────────────────────────────────────────────────────────
  // The dots rearrange into a shape by sampling a glyph rendered offscreen at
  // the grid's own resolution. An emoji gives a real silhouette for a common
  // noun; anything without one falls back to spelling the word, which always
  // works. No drawing model is involved — a 0.5B model cannot draw a dog, but
  // the font on the machine already knows what one looks like.
  const EMOJI = {
    dog:"🐕", cat:"🐈", heart:"❤️", star:"⭐", tree:"🌳", fish:"🐟", bird:"🐦",
    house:"🏠", home:"🏠", car:"🚗", plane:"✈️", rocket:"🚀", boat:"⛵",
    sun:"☀️", moon:"🌙", cloud:"☁️", rain:"🌧️", snow:"❄️", fire:"🔥",
    skull:"💀", ghost:"👻", alien:"👽", robot:"🤖", brain:"🧠", eye:"👁️",
    hand:"✋", flower:"🌸", leaf:"🍃", apple:"🍎", pizza:"🍕", coffee:"☕",
    beer:"🍺", cake:"🎂", gift:"🎁", key:"🔑", lock:"🔒", clock:"🕐",
    globe:"🌍", earth:"🌍", world:"🌍", map:"🗺️", anchor:"⚓", crown:"👑",
    diamond:"💎", music:"🎵", camera:"📷", phone:"📱", book:"📖", pencil:"✏️",
    lightning:"⚡", bolt:"⚡", umbrella:"☂️", balloon:"🎈", bomb:"💣",
    whale:"🐳", turtle:"🐢", snake:"🐍", horse:"🐴", cow:"🐄", pig:"🐖",
    bear:"🐻", panda:"🐼", monkey:"🐒", elephant:"🐘", butterfly:"🦋",
    spider:"🕷️", bee:"🐝", crab:"🦀", octopus:"🐙", penguin:"🐧",
  };

  /**
   * Rasterise a glyph and return the cells it covers, in normalised view space.
   * Sampling at the grid's own resolution keeps the result on the same lattice
   * as the map, so the transition reads as the same dots moving.
   */
  function glyphTargets(text, { cols = grid.nCols, rows = grid.nRows } = {}) {
    const S = 8;                       // supersample per cell, for a clean edge
    const off = document.createElement("canvas");
    off.width = cols * S;
    off.height = rows * S;
    const octx = off.getContext("2d", { willReadFrequently: true });
    octx.fillStyle = "#000";
    octx.fillRect(0, 0, off.width, off.height);

    octx.fillStyle = "#fff";
    octx.textAlign = "center";
    octx.textBaseline = "middle";

    // Grow the type until it fills the frame, then draw once.
    let size = off.height * 0.9;
    octx.font = `900 ${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",ui-monospace,monospace`;
    const w = octx.measureText(text).width;
    if (w > off.width * 0.92) {
      size = size * (off.width * 0.92) / w;
      octx.font = `900 ${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",ui-monospace,monospace`;
    }
    octx.fillText(text, off.width / 2, off.height / 2);

    const data = octx.getImageData(0, 0, off.width, off.height).data;
    const targets = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let lit = 0;
        for (let sy = 0; sy < S; sy += 2) {
          for (let sx = 0; sx < S; sx += 2) {
            const px = (c * S + sx), py = (r * S + sy);
            const i = (py * off.width + px) * 4;
            // Any channel: emoji are colour, text is white.
            if (data[i] > 90 || data[i + 1] > 90 || data[i + 2] > 90) lit++;
          }
        }
        if (lit >= 3) targets.push({ gx: (c + 0.5) / cols, gy: (r + 0.5) / rows });
      }
    }
    return targets;
  }

  /** Give each target the nearest still-unclaimed dot, so paths do not cross. */
  function assignTargets(targets) {
    for (const d of dots) { d.tgx = null; d.tgy = null; }
    const used = new Uint8Array(dots.length);
    for (const t of targets) {
      let best = -1, bestD = Infinity;
      for (let i = 0; i < dots.length; i++) {
        if (used[i]) continue;
        const hx = (dots[i].lon + 180) / 360;
        const hy = (grid.latMax - dots[i].lat) / (grid.latMax - grid.latMin);
        const dx = hx - t.gx, dy = hy - t.gy;
        const v = dx * dx + dy * dy;
        if (v < bestD) { bestD = v; best = i; }
      }
      if (best < 0) break;
      used[best] = 1;
      dots[best].tgx = t.gx;
      dots[best].tgy = t.gy;
    }
    return targets.length;
  }

  function doShape(word) {
    const clean = (word || "").trim().toLowerCase();
    if (!clean) return;
    const glyph = EMOJI[clean] || EMOJI[clean.replace(/s$/, "")];
    const targets = glyphTargets(glyph || clean.toUpperCase().slice(0, 10));
    if (!targets.length) { setStatus("cannot draw that"); return; }
    assignTargets(targets);
    morph = { dir: 1, born: performance.now() / 1000 };
    marker = null;
    labelEl.classList.remove("on");
    setStatus(glyph ? `${clean} ${glyph}` : clean);
  }

  function releaseShape() {
    if (morph && morph.dir === 1) morph = { dir: -1, born: performance.now() / 1000 };
  }

  // ── Intents ────────────────────────────────────────────────────────────────
  // The director only ever emits one of these. All motion is client-side.
  function applyIntent(intent) {
    if (!intent || !intent.intent) return;
    switch (intent.intent) {
      case "locate":
        releaseShape();
        return doLocate(intent.params || {});
      case "shape":
        return doShape((intent.params || {}).word);
      case "idle":
      default:
        marker = null;
        releaseShape();
        labelEl.classList.remove("on");
        setStatus("");
    }
  }

  function markAt(lon, lat, label) {
    const index = nearestDot(lon, lat);
    if (index < 0) { setStatus("no land near there"); return; }
    marker = { index, born: performance.now() / 1000, label };
    const country = grid.countries[dots[index].country];
    setStatus(label || (country ? country.name : "located"));
  }

  async function doLocate(params) {
    if (typeof params.lat === "number" && typeof params.lon === "number") {
      markAt(params.lon, params.lat, params.label);
      return;
    }
    setStatus("finding you", true);

    // Browser geolocation first; it is the accurate one and needs consent.
    const viaBrowser = await new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        () => resolve(null),
        { timeout: 8000, maximumAge: 600000 }
      );
    });
    if (viaBrowser) { markAt(viaBrowser.lon, viaBrowser.lat, "you"); return; }

    // Denied or unavailable — fall back to IP geolocation via the backend,
    // which keeps the third-party call off the page's origin.
    try {
      const res = await fetch("/api/whereami");
      const d = await res.json();
      if (typeof d.lat === "number") {
        markAt(d.lon, d.lat, d.city || "approx");
        return;
      }
    } catch (_) { /* fall through */ }
    setStatus("couldn’t work out where you are");
  }

  // ── Director ───────────────────────────────────────────────────────────────
  async function send(text) {
    setStatus("reading that", true);
    try {
      const res = await fetch("/api/intent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error("intent " + res.status);
      applyIntent(await res.json());
    } catch (err) {
      setStatus("no answer from the server");
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    send(text);
  });

  // ResizeObserver catches zoom and container changes that resize events miss.
  new ResizeObserver(layout).observe(canvas);
  window.addEventListener("resize", layout);

  // ── Boot ───────────────────────────────────────────────────────────────────
  loadGrid()
    .then(() => {
      setStatus(`${grid.count} dots, one per ${grid.step}° of the real world`);
      requestAnimationFrame(draw);
      setTimeout(() => setStatus(""), 4000);
    })
    .catch((err) => setStatus("the map did not load"));
})();
</script>
</body>
</html>
